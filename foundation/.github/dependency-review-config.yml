fail-on-severity: high
fail-on-scopes:
  - runtime
  - development
  - unknown
vulnerability-check: true
license-check: true
warn-only: false
comment-summary-in-pr: never
show-openssf-scorecard: true
warn-on-openssf-scorecard-level: 3
show-patched-versions: true
deny-licenses:
  - GPL-2.0
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0
  - GPL-3.0-only
  - GPL-3.0-or-later
  - AGPL-1.0
  - AGPL-1.0-only
  - AGPL-1.0-or-later
  - AGPL-3.0
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - LGPL-2.0
  - LGPL-2.0-only
  - LGPL-2.0-or-later
  - LGPL-2.1
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - LicenseRef-clearlydefined-OTHER
