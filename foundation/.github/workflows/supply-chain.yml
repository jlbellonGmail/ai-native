# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Supply Chain Security

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

env:
  ARTIFACT_BASENAME: ai-foundation-source-${{ github.sha }}.tar.gz
  ARTIFACT_UPLOAD_NAME: ai-foundation-supply-chain-${{ github.sha }}

permissions:
  contents: read

jobs:
  artifact-verification:
    name: Artifact Verification
    runs-on: ubuntu-latest
    env:
      SUPPLY_CHAIN_DIR: ${{ github.workspace }}/.supply-chain
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Build validation
        run: corepack pnpm build

      - name: Package verifiable source artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$SUPPLY_CHAIN_DIR/artifacts"

          tar \
            --exclude='.git' \
            --exclude='.supply-chain' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='logs' \
            --exclude='coverage' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='tmp' \
            --exclude='*.log' \
            --exclude='*.tsbuildinfo' \
            -czf "$SUPPLY_CHAIN_DIR/artifacts/$ARTIFACT_BASENAME" \
            .

          tar -tzf "$SUPPLY_CHAIN_DIR/artifacts/$ARTIFACT_BASENAME" > "$SUPPLY_CHAIN_DIR/artifacts/artifact-manifest.txt"

          if grep -E '(^|/)(\.git|\.supply-chain|node_modules|\.next|logs|coverage|dist|build|tmp)(/|$)|(^|/)\.env(\.|$)|\.log$|\.tsbuildinfo$' "$SUPPLY_CHAIN_DIR/artifacts/artifact-manifest.txt"; then
            echo "Forbidden path detected in supply chain artifact"
            exit 1
          fi

          (
            cd "$SUPPLY_CHAIN_DIR/artifacts"
            sha256sum "$ARTIFACT_BASENAME" > "$ARTIFACT_BASENAME.sha256"
            sha256sum --check "$ARTIFACT_BASENAME.sha256"
          )

      - name: Generate supply chain validation report
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const artifactName = process.env.ARTIFACT_BASENAME;
          const artifactDir = `${process.env.SUPPLY_CHAIN_DIR}/artifacts`;
          const manifest = readFileSync(`${artifactDir}/artifact-manifest.txt`, 'utf8')
            .split('\n')
            .filter(Boolean);
          const checksum = readFileSync(`${artifactDir}/${artifactName}.sha256`, 'utf8').trim();
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));

          const report = {
            task: 'W1-T6',
            repository: 'ai-foundation',
            artifact: {
              name: artifactName,
              checksum,
              manifestEntries: manifest.length,
              excludedPatterns: [
                '.git',
                '.supply-chain',
                '.env',
                '.env.*',
                'node_modules',
                '.next',
                'logs',
                'coverage',
                'dist',
                'build',
                'tmp',
                '*.log',
                '*.tsbuildinfo'
              ]
            },
            validation: {
              packageManager: 'pnpm',
              hasCanonicalLockfile: true,
              typecheckScript: Boolean(packageJson.scripts?.typecheck),
              buildScript: Boolean(packageJson.scripts?.build),
              provenanceAction: 'actions/attest@v4',
              artifactVerification: 'sha256sum --check'
            },
            slsaReadiness: {
              buildPlatform: 'GitHub Actions hosted runner',
              provenanceFormat: 'SLSA build provenance via GitHub artifact attestations',
              verification: 'gh attestation verify <artifact> -R <owner>/<repo>',
              status: 'ready for remote GitHub attestation validation'
            }
          };

          writeFileSync(`${artifactDir}/supply-chain-validation.json`, `${JSON.stringify(report, null, 2)}\n`);
          NODE

      - name: Upload supply chain artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_UPLOAD_NAME }}
          path: ${{ env.SUPPLY_CHAIN_DIR }}/artifacts
          if-no-files-found: error
          retention-days: 30

  provenance:
    name: Provenance
    runs-on: ubuntu-latest
    needs: artifact-verification
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      SUPPLY_CHAIN_DIR: ${{ github.workspace }}/.supply-chain
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_UPLOAD_NAME }}
          path: ${{ env.SUPPLY_CHAIN_DIR }}/artifacts

      - name: Verify downloaded artifact checksum
        shell: bash
        run: |
          set -euo pipefail

          (
            cd "$SUPPLY_CHAIN_DIR/artifacts"
            sha256sum --check "$ARTIFACT_BASENAME.sha256"
          )

      - name: Generate SLSA provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.SUPPLY_CHAIN_DIR }}/artifacts/${{ env.ARTIFACT_BASENAME }}
