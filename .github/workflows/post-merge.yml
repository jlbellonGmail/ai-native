name: post-merge

# M4.3 (PAR-POST-MERGE, PAR-HUMAN-MERGE). READ-ONLY: verifies after a merge that
# the merge was done by a human maintainer (never the worker/bot identity),
# that the merge commit is on main, and that a green merge-gate from the
# `ai-native-trust` App existed on the merged head. It cannot push, tag or
# comment; a red run is the alert.

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  post-merge:
    name: post-merge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the base the PR was merged onto (config from base, never from the merged PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify merge was human and gated
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node runtime/gates/post-merge.mjs

      - name: STATUS/git integrity (read-only)
        shell: bash
        run: node runtime/status/validate-integrity.mjs
