name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  circuit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests (pytest)
        run: pytest -v

      - name: Validar adaptadores agenticos
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/sync-agentic-adapters.ps1 -Check

  product-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ############################################################
      # PLACEHOLDER: build/test del stack de producto.
      #
      # Este template no tiene stack de producto propio todavia (ver
      # seccion "Stack" en AGENTS.md). Cuando el proyecto real que nazca
      # de este template defina su stack (frontend, backend, etc.):
      #
      #   1. Documentar esa decision primero en
      #      docs/tecnica/arquitectura.md.
      #   2. Reemplazar POR COMPLETO el step placeholder de abajo
      #      (`Placeholder (sin stack definido)`) por los pasos reales
      #      de instalacion y test de ese stack (por ejemplo
      #      actions/setup-node + npm ci + npm test). No agregar los
      #      pasos reales al lado del placeholder: se reemplaza, no se
      #      acumula.
      #
      # Este job es gate obligatorio igual que circuit-tests (ver
      # seccion "CI/CD" de AGENTS.md), aunque hoy solo corra un
      # placeholder que siempre pasa.
      # ############################################################

      - name: Placeholder (sin stack definido)
        run: |
          echo "product-tests: sin stack de producto definido todavia. Ver docs/tecnica/arquitectura.md."

  # Gate obligatorio igual que circuit-tests y product-tests (ver AGENTS.md,
  # seccion "CI/CD"): corre tests/test_local_reconciler_scripts.py, que el
  # pytestmark del propio archivo salta en circuit-tests (ubuntu-latest)
  # porque ejercita Start-Process -WindowStyle Hidden de PowerShell 5.1
  # Desktop, especifico de Windows. Sin continue-on-error: si esta suite
  # falla, el job queda rojo y bloquea el merge.
  local-reconciler-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests del reconciliador local (pytest, Windows)
        run: pytest -v tests/test_local_reconciler_scripts.py
