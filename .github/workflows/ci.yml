name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  circuit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests (pytest)
        run: pytest -v

      - name: Validar adaptadores agenticos
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/sync-agentic-adapters.ps1 -Check

  product-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ############################################################
      # PLACEHOLDER: build/test del stack de producto.
      #
      # Este template no tiene stack de producto propio todavia (ver
      # seccion "Stack" en AGENTS.md). Cuando el proyecto real que nazca
      # de este template defina su stack (frontend, backend, etc.):
      #
      #   1. Documentar esa decision primero en
      #      docs/tecnica/arquitectura.md.
      #   2. Reemplazar POR COMPLETO el step placeholder de abajo
      #      (`Placeholder (sin stack definido)`) por los pasos reales
      #      de instalacion y test de ese stack (por ejemplo
      #      actions/setup-node + npm ci + npm test). No agregar los
      #      pasos reales al lado del placeholder: se reemplaza, no se
      #      acumula.
      #
      # Este job es gate obligatorio igual que circuit-tests (ver
      # seccion "CI/CD" de AGENTS.md), aunque hoy solo corra un
      # placeholder que siempre pasa.
      # ############################################################

      - name: Placeholder (sin stack definido)
        run: |
          echo "product-tests: sin stack de producto definido todavia. Ver docs/tecnica/arquitectura.md."

  # Gate obligatorio igual que circuit-tests y product-tests (ver AGENTS.md,
  # seccion "CI/CD"): corre tests/test_local_reconciler_scripts.py, que el
  # pytestmark del propio archivo salta en circuit-tests (ubuntu-latest)
  # porque ejercita Start-Process -WindowStyle Hidden de PowerShell 5.1
  # Desktop, especifico de Windows. Sin continue-on-error: si esta suite
  # falla, el job queda rojo y bloquea el merge.
  local-reconciler-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # ################################################################
      # DIAGNOSTICO TEMPORAL: el fallo de esta suite en windows-latest ya
      # se reprodujo en dos runs reales (33580980427, 33583676654) incluso
      # despues de corregir Start-Process -WindowStyle Hidden -> -NoNewWindow,
      # asi que la causa raiz sigue sin confirmarse con evidencia directa
      # del runner. Este step corre pytest normalmente, preserva su exit
      # code real (no lo enmascara con continue-on-error/|| true/exit 0) y
      # ademas imprime evidencia forense -- procesos powershell/pwsh vivos,
      # arbol de archivos bajo el temp de pytest, contenido de logs
      # residuales y estado/detecciones de Windows Defender -- para poder
      # distinguir si el hijo nunca arranca, arranca y muere, escribe en
      # otra ruta, o el lock se crea y se borra demasiado rapido. Remover
      # este bloque de diagnostico una vez confirmada la causa raiz real.
      # ################################################################
      - name: Tests del reconciliador local (pytest, Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          pytest -v tests/test_local_reconciler_scripts.py
          $pytestExitCode = $LASTEXITCODE

          Write-Host "`n========== DIAGNOSTICO RECONCILIADOR (pytest exit code: $pytestExitCode) =========="

          Write-Host "`n--- Version de PowerShell (pwsh, este step) ---"
          $PSVersionTable | Format-List

          $winPwsh = Get-Command powershell.exe -ErrorAction SilentlyContinue
          if ($winPwsh) {
              Write-Host "`n--- Version de Windows PowerShell (powershell.exe, usado por start_reconciler) ---"
              & $winPwsh.Source -NoProfile -Command '$PSVersionTable | Format-List'
          } else {
              Write-Host "`n--- powershell.exe no encontrado en PATH ---"
          }

          Write-Host "`n--- Procesos powershell/pwsh en ejecucion ---"
          Get-CimInstance Win32_Process |
              Where-Object { $_.Name -match '^(powershell|pwsh)\.exe$' } |
              Select-Object ProcessId, ParentProcessId, CreationDate, CommandLine |
              Format-List

          Write-Host "`n--- Rutas esperadas por el test (main/.git/feature-reconcilers/<slug>.{pid,log,err.log}) ---"
          Write-Host "Buscando bajo `$env:TEMP = $env:TEMP"

          $reconcilerDirs = Get-ChildItem -Path $env:TEMP -Directory -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\main\\\.git\\feature-reconcilers$' }

          if (-not $reconcilerDirs) {
              Write-Host "No se encontro ningun directorio 'main/.git/feature-reconcilers' bajo `$env:TEMP."
          }

          foreach ($dir in $reconcilerDirs) {
              Write-Host "`n>>> $($dir.FullName)"
              Get-ChildItem -Path $dir.FullName -Force -ErrorAction SilentlyContinue |
                  Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

              foreach ($f in (Get-ChildItem -Path $dir.FullName -File -Force -ErrorAction SilentlyContinue)) {
                  Write-Host "`n----- Contenido de $($f.FullName) ($($f.Length) bytes) -----"
                  if ($f.Length -gt 0) {
                      Get-Content -LiteralPath $f.FullName -Raw -ErrorAction SilentlyContinue
                  } else {
                      Write-Host "(vacio)"
                  }
              }
          }

          Write-Host "`n--- Busqueda amplia de *.pid / *.log / *.err.log residuales bajo `$env:TEMP ---"
          Get-ChildItem -Path $env:TEMP -Recurse -Force -ErrorAction SilentlyContinue -Include "*.pid","*.log","*.err.log" |
              Where-Object { $_.FullName -match 'feature-reconcilers' } |
              Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize -Wrap

          Write-Host "`n--- Estado de Windows Defender ---"
          try {
              Get-MpComputerStatus -ErrorAction Stop |
                  Select-Object AntivirusEnabled, RealTimeProtectionEnabled, AMServiceEnabled |
                  Format-List
          } catch {
              Write-Host "Get-MpComputerStatus no disponible: $($_.Exception.Message)"
          }

          Write-Host "`n--- Detecciones recientes de Windows Defender ---"
          try {
              $threats = Get-MpThreatDetection -ErrorAction Stop
              if ($threats) { $threats | Format-List } else { Write-Host "Sin detecciones registradas." }
          } catch {
              Write-Host "Get-MpThreatDetection no disponible: $($_.Exception.Message)"
          }

          Write-Host "`n--- Eventos de Windows Defender (Operational, ultimos 15 min, relacionados a powershell/pwsh) ---"
          try {
              $since = (Get-Date).AddMinutes(-15)
              Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-Windows Defender/Operational'; StartTime = $since } -ErrorAction Stop |
                  Where-Object { $_.Message -match 'powershell|pwsh' } |
                  Select-Object TimeCreated, Id, LevelDisplayName, Message |
                  Format-List
          } catch {
              Write-Host "No se pudieron leer eventos de Windows Defender: $($_.Exception.Message)"
          }

          Write-Host "`n--- Eventos de fallo de aplicacion (Application, ultimos 15 min, relacionados a powershell/pwsh) ---"
          try {
              $since = (Get-Date).AddMinutes(-15)
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $since; Id = 1000, 1001, 1002 } -ErrorAction Stop |
                  Where-Object { $_.Message -match 'powershell|pwsh' } |
                  Select-Object TimeCreated, Id, LevelDisplayName, Message |
                  Format-List
          } catch {
              Write-Host "No se pudieron leer eventos de Application: $($_.Exception.Message)"
          }

          Write-Host "`n========== FIN DIAGNOSTICO (exit code real de pytest: $pytestExitCode) =========="

          exit $pytestExitCode