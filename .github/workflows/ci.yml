name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  circuit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests (pytest)
        run: pytest -v

      - name: Validar adaptadores agenticos
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/sync-agentic-adapters.ps1 -Check
        continue-on-error: true

      # Product tests placeholder - gate obligatorio per AGENTS.md a pesar
      # de que hoy solo corra un placeholder, se mantiene como check
      # requerido para que branch protection no tenga que actualizarse
      # el dia que el stack real llegue.
      - name: Product tests (placeholder)
        run: echo "product-tests: sin stack de producto definido. Ver docs/tecnica/arquitectura.md."