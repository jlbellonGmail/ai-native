name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests (pytest)
        run: pytest -v

      # Cuando el proyecto real defina su stack de producto (frontend,
      # backend, etc.), agregar aquí los pasos de instalación y test que
      # correspondan (npm ci / npm test, etc.). No hay nada de eso
      # todavía en este template.
