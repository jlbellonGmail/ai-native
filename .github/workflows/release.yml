name: Release

# M4.2: publishes an immutable, attested platform release.
#   tag vX.Y.Z[-alpha.N|-rc.N] on a commit reachable from main
#     -> build (gates, deterministic bundle built twice and compared, SBOM)
#     -> publish (sigstore provenance for every asset, draft -> publish)
#     -> verify (fresh runner: checksums, attestations, real bootstrap sync
#                from the public release with --require-attestation)
# On pull requests only `build` runs, as a dry run with a throw-away version,
# so this file is exercised before any tag exists. Nothing is published
# without a tag. Every action is pinned by full SHA (supply-chain.yml).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "runtime/release/**"
      - "runtime/bootstrap/**"
      - "runtime/main.mjs"
      - "governance/versioning/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (gates, reproducible bundle, SBOM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="v0.0.0-alpha.0"   # dry run: never published
          fi
          echo "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|rc)\.[0-9]+)?$'
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag commit must be reachable from main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Tag commit must have a green CI run
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ok=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json conclusion --jq 'length')
          [ "$ok" -ge 1 ] || { echo "no successful CI run for $GITHUB_SHA"; exit 1; }

      - name: Release gates (parity, contracts, runtime tests)
        shell: bash
        env:
          # the pilot tests need the network and an authenticated gh (attestation verify); a missing
          # prerequisite must FAIL the release gate, never skip
          AI_NATIVE_REQUIRE_NETWORK: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node parity/validate-parity.mjs
          node contracts/validate-contracts.mjs
          node core/validate-core.mjs
          node runtime/status/validate-integrity.mjs
          node runtime/docs/validate-doc-drift.mjs
          node scripts/validate-actions-pinned.mjs
          node --test runtime/*/*.test.mjs contracts/*.test.mjs core/*.test.mjs parity/*.test.mjs evaluation/*/*.test.mjs scripts/*.test.mjs

      # The audit gate is mandatory for rc and stable. For alpha (internal
      # prerelease) the P-conditions of the roadmap do not require an audit
      # report, so a missing one is reported, not blocking. It never gates merges.
      - name: Audit release-gate (PLATFORM profile)
        continue-on-error: ${{ github.event_name == 'pull_request' || contains(steps.v.outputs.version, '-alpha.') }}
        shell: bash
        run: node runtime/audit/cli.mjs release-gate --profile PLATFORM --candidate "$GITHUB_SHA" --root .

      - name: Build bundle (twice, must be byte-identical)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          node runtime/release/build.mjs --version "$v" --commit "$GITHUB_SHA" --out dist
          node runtime/release/build.mjs --version "$v" --commit "$GITHUB_SHA" --out dist-second
          cmp "dist/ai-native-$v.tar.gz" "dist-second/ai-native-$v.tar.gz"
          digest="sha256:$(sha256sum "dist/ai-native-$v.tar.gz" | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          mkdir sbom-src
          tar -xzf "dist/ai-native-$v.tar.gz" -C sbom-src

      - name: Generate CycloneDX SBOM of the release contents
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-src
          format: cyclonedx-json
          output-file: dist/ai-native-${{ steps.v.outputs.version }}.sbom.cdx.json
          upload-artifact: false

      - name: Validate SBOM and finalize checksums
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          node -e '
            const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (s.bomFormat !== "CycloneDX" || !Array.isArray(s.components ?? [])) { console.error("not a CycloneDX SBOM"); process.exit(1); }
            console.log("CycloneDX", s.specVersion, "components:", (s.components ?? []).length);
          ' "dist/ai-native-$v.sbom.cdx.json"
          (cd dist && sha256sum "ai-native-$v.tar.gz" "ai-native-$v.sbom.cdx.json" platform.json revocations-*.json > SHA256SUMS && cat SHA256SUMS)

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist
          if-no-files-found: error

  publish:
    name: publish (provenance, release)
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout (the tagged commit, for the pre-publish guard)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # F-09: the tag push can start more than one run. Refuse, before attesting or creating anything, if ANY release
      # (published or draft) already exists for this tag. Never deletes or edits a release.
      - name: Refuse to publish twice for the same tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: node runtime/release/assert-unreleased.mjs --tag "$VERSION" --repo "$GITHUB_REPOSITORY"

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Re-check the bytes that were built
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          v="${{ needs.build.outputs.version }}"
          [ "sha256:$(sha256sum "ai-native-$v.tar.gz" | cut -d' ' -f1)" = "${{ needs.build.outputs.digest }}" ]

      - name: Attest build provenance (sigstore) for every asset
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ai-native-*.tar.gz
            dist/ai-native-*.sbom.cdx.json
            dist/platform.json
            dist/revocations-*.json

      - name: Attest SBOM against the bundle
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/ai-native-${{ needs.build.outputs.version }}.tar.gz
          sbom-path: dist/ai-native-${{ needs.build.outputs.version }}.sbom.cdx.json

      - name: Create draft release, upload assets, publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" "dist/ai-native-$VERSION.sigstore.json"
          flags=""
          case "$VERSION" in *-alpha.*|*-rc.*) flags="--prerelease" ;; esac
          notes="Platform release $VERSION at $GITHUB_SHA. Bundle digest: ${{ needs.build.outputs.digest }}. Verify: gh attestation verify ai-native-$VERSION.tar.gz --repo $GITHUB_REPOSITORY."
          # one command per line, no trailing backslashes: a workflow that runs the pushed branch file may not contain any (secret-exposure.mjs)
          assets=("dist/ai-native-$VERSION.tar.gz" "dist/ai-native-$VERSION.sbom.cdx.json" "dist/ai-native-$VERSION.sigstore.json" dist/platform.json dist/SHA256SUMS dist/revocations-*.json)
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" $flags --draft --verify-tag --title "ai-native $VERSION" --notes "$notes" "${assets[@]}"
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false

  verify:
    name: verify (public assets, attestations, bootstrap sync)
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download the PUBLISHED assets (no authentication)
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir pub && cd pub
          for a in "ai-native-$VERSION.tar.gz" "ai-native-$VERSION.sbom.cdx.json" "ai-native-$VERSION.sigstore.json" platform.json SHA256SUMS; do
            curl -fsSL --retry 3 -O "https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$a"
          done
          # the revocations asset is revocations-<n>.json with the HIGHEST n the release published: take its name from SHA256SUMS
          REV="$(awk '{print $2}' SHA256SUMS | { grep -E '^revocations-[0-9]+\.json$' || true; } | sort -V | tail -1)"
          [ -n "$REV" ] || { echo "no revocations asset listed in SHA256SUMS"; exit 1; }
          curl -fsSL --retry 3 -O "https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$REV"
          echo "$REV" > revocations.name
          sha256sum -c SHA256SUMS

      - name: Verify provenance of every asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd pub
          for a in "ai-native-$VERSION.tar.gz" "ai-native-$VERSION.sbom.cdx.json" platform.json "$(cat revocations.name)"; do
            gh attestation verify "$a" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          # offline: the published sigstore bundle verifies without network lookups of attestations
          gh attestation verify "ai-native-$VERSION.tar.gz" --repo "$GITHUB_REPOSITORY" --bundle "ai-native-$VERSION.sigstore.json"

      - name: Bootstrap sync from the public release (remote source, attestation required)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          project="$(mktemp -d)"; cache="$(mktemp -d)"
          node -e '
            const [project, repo, version, commit, digest] = process.argv.slice(1);
            require("fs").writeFileSync(project + "/ai-native.lock.json", JSON.stringify({
              schemaVersion: 1, platform: { repo: "github:" + repo, version, commit, digest }, profiles: ["factory"],
            }));
          ' "$project" "$GITHUB_REPOSITORY" "$VERSION" "$GITHUB_SHA" "$DIGEST"
          node runtime/bootstrap/cli.mjs sync --require-attestation --project "$project" --cache "$cache"
          node runtime/bootstrap/cli.mjs doctor --project "$project" --cache "$cache"
          out="$(node runtime/bootstrap/cli.mjs run --project "$project" --cache "$cache" -- version | head -1)"
          echo "$out"
          [ "$out" = "$VERSION $GITHUB_SHA" ]
