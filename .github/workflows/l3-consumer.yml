name: l3-consumer

# L3 consumer gate (M5; P41 / C6). REUSABLE across repositories (workflow_call): a consumer
# calls it from its own PR workflow, pinned by full SHA:
#
#   on: { pull_request: { branches: [main] } }
#   jobs:
#     l3:
#       permissions: { contents: read }
#       uses: jlbellonGmail/ai-native/.github/workflows/l3-consumer.yml@<40-hex sha>
#
# TRUST ROOT (P44). The code that judges a PR must not be chosen by that PR:
#   * the platform repository is fixed by the `platform-repo` input (default jlbellonGmail/ai-native);
#     a lock that points anywhere else FAILS the gate;
#   * the platform commit comes from the lock on the BASE branch when the base has one (a PR that
#     bumps the lock is judged by the platform the base already trusts, and its NEW release is
#     verified by `sync`); only a first adoption (no lock on base) falls back to the head lock;
#   * either way the commit must be in the history of the platform repo's default branch, so an
#     unreviewed or foreign commit never runs.
# Then, all read-only with `contents: read` and no credentials:
#   1. `bootstrap sync --require-attestation`: downloads the release pinned by the HEAD lock, checks its
#      sha256 against that lock BEFORE caching and verifies the sigstore attestation (fail closed);
#   2. `runtime/consumer/l3.mjs --require-base`: lock, bootstrap READY, integrity, ASSESS dry-run,
#      P45 on touched events.jsonl, adoption drift, product tests. With no resolvable base it FAILS.
# v4.1.0 Native Acceptance (spec 002 RF-25/RF-31/RF-35 in consumers), from the same trusted platform commit:
#   acceptance-closure    fresh checkout of the PR head, in its own job (not the L3 product-test job): re-runs the
#                         changed features' mandatory cases, uploads the raw output and anchors each output's digest
#                         in this job's log from memory;
#   acceptance-analyze    no product test, no candidate code: the candidate is fetched as Git objects only and
#                         runtime/acceptance/verdict.mjs derives the verdict from the raw bytes, the job-log anchors
#                         and this run (caller workflow path, pull_request event, head SHA). A PR that edits the
#                         caller workflow changes the closure producer and is BLOCKED (the platform cannot prevent
#                         that edit from the consumer's PR; it reports it);
#   acceptance-human      only for NEEDS_HUMAN, in the consumer-owned Environment named by `acceptance-environment`
#                         (required reviewers: the consumer's humans); without it NEEDS_HUMAN is BLOCKED, never PASS;
#   acceptance-governance the decision (runtime/consumer/acceptance-gate.mjs). The consumer makes THIS job a required
#                         check; the caller grants `permissions: { contents: read, actions: read }`.
# `platform-ref` (optional) overrides the platform commit, ONLY for evidence runs of a platform not yet
# released; it must still be on the platform's default branch and it is reported as a warning.

on:
  workflow_call:
    inputs:
      platform-repo:
        description: "The only platform repository this gate will run code from"
        required: false
        type: string
        default: "jlbellonGmail/ai-native"
      platform-ref:
        description: "Evidence runs only: platform commit to run the gate from instead of the pinned one"
        required: false
        type: string
        default: ""
      base-ref:
        description: "Branch the PR targets. Default: the event's base branch. No base -> the gate FAILS."
        required: false
        type: string
        default: ""
      acceptance-environment:
        description: "Consumer-owned GitHub Environment whose required reviewers approve acceptance governance findings (NEEDS_HUMAN). Empty -> NEEDS_HUMAN is BLOCKED."
        required: false
        type: string
        default: ""
      acceptance-reviewers:
        description: "Comma-separated logins of the consumer's human reviewers; the Environment approval must come from one of them and not from the PR author. Empty -> NEEDS_HUMAN is BLOCKED."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  l3:
    name: l3-consumer
    runs-on: ubuntu-latest
    outputs:
      platform_commit: ${{ steps.lock.outputs.commit }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - name: Checkout consumer (PR head, no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the base branch (required)
        id: base
        shell: bash
        env:
          BASE_REF: ${{ inputs.base-ref }}
          EVENT_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="${BASE_REF:-${EVENT_BASE:-}}"
          [ -n "$base" ] || { echo "::error::no base branch: call this workflow from a pull_request event or pass base-ref (a gate must not run without its base)"; exit 1; }
          [[ "$base" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid base-ref"; exit 1; }
          git -C consumer fetch --no-tags origin "$base"
          git -C consumer rev-parse --verify "origin/$base" >/dev/null
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Read the locks and pick the trust root (base lock first, then the head lock)
        id: lock
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.base }}
          PLATFORM_REPO: ${{ inputs.platform-repo }}
          INPUT_REF: ${{ inputs.platform-ref }}
        run: |
          set -euo pipefail
          test -f consumer/ai-native.lock.json || { echo "::error::ai-native.lock.json not found: this repository is not adopted"; exit 1; }
          # absence is checked explicitly: any other git failure must stop the job, not silently pick the PR-controlled lock
          if git -C consumer cat-file -e "origin/$BASE:ai-native.lock.json" 2>/dev/null; then
            git -C consumer show "origin/$BASE:ai-native.lock.json" > "$RUNNER_TEMP/base.lock.json"
          else
            rm -f "$RUNNER_TEMP/base.lock.json"
          fi
          node -e '
            const fs = require("fs");
            const read = (f) => (fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")).platform ?? {} : null);
            const head = read("consumer/ai-native.lock.json");
            const base = read(process.env.RUNNER_TEMP + "/base.lock.json");
            const expected = "github:" + process.env.PLATFORM_REPO;
            for (const [name, p] of [["head", head], ["base", base]]) {
              if (!p) continue;
              if (p.repo !== expected) throw new Error(`${name} lock points to ${p.repo}, this gate only runs code from ${expected}`);
              if (!/^[0-9a-f]{40}$/.test(p.commit || "")) throw new Error(`${name} lock.platform.commit is not a full SHA`);
            }
            const source = base ? "base" : "head";
            const pinned = (base ?? head).commit;
            const ref = process.env.INPUT_REF;
            if (ref && !/^[0-9a-f]{40}$/.test(ref)) throw new Error("platform-ref must be a full 40-hex SHA");
            const commit = ref || pinned;
            if (ref && ref !== pinned) console.log(`::warning::EVIDENCE RUN: gate code comes from platform-ref ${ref}, not from the ${source} lock pin ${pinned}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${commit}\nsource=${ref ? "input" : source}\n`);
            console.log(`trust root: platform ${process.env.PLATFORM_REPO} @ ${commit} (from ${ref ? "platform-ref input" : source + " lock"})`);
          '

      # The ref given to actions/checkout is NEVER derived from the PR: the platform's default branch is
      # checked out (trusted), and only then is the pinned commit verified and selected.
      - name: Checkout platform (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform-repo }}
          path: platform
          fetch-depth: 0
          persist-credentials: false

      - name: Select the trusted platform commit (must be in the history of the default branch)
        shell: bash
        env:
          COMMIT: ${{ steps.lock.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid platform commit"; exit 1; }
          default="$(git -C platform symbolic-ref --short HEAD)"
          git -C platform merge-base --is-ancestor "$COMMIT" "origin/$default" || { echo "::error::platform commit $COMMIT is not in the history of origin/$default: refusing to run it"; exit 1; }
          git -C platform checkout --detach "$COMMIT"

      - name: Bootstrap sync (download, sha256 vs lock, sigstore attestation)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node platform/runtime/bootstrap/cli.mjs sync --require-attestation --project consumer --cache "$RUNNER_TEMP/ai-native-cache"
          node platform/runtime/bootstrap/cli.mjs doctor --project consumer --cache "$RUNNER_TEMP/ai-native-cache"

      # Product tests of a Python profile (productSetupCommand/productTestCommand) need an interpreter and pip on a clean runner.
      - name: Set up Python for the product tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: L3 consumer gate
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          node platform/runtime/consumer/l3.mjs --project consumer --cache "$RUNNER_TEMP/ai-native-cache" --base "origin/$BASE" --require-base --out "$RUNNER_TEMP/l3.json"

      - name: Upload the L3 result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l3-result
          path: ${{ runner.temp }}/l3.json
          if-no-files-found: warn

  acceptance-closure:
    name: acceptance-closure
    needs: l3
    if: always() && github.event_name == 'pull_request' && needs.l3.outputs.platform_commit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout the evaluated PR head (fresh, no credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: consumer
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout platform (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform-repo }}
          path: platform
          fetch-depth: 0
          persist-credentials: false

      - name: Select the trusted platform commit (same trust root as the L3 job)
        shell: bash
        env:
          COMMIT: ${{ needs.l3.outputs.platform_commit }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid platform commit"; exit 1; }
          default="$(git -C platform symbolic-ref --short HEAD)"
          git -C platform merge-base --is-ancestor "$COMMIT" "origin/$default" || { echo "::error::platform commit $COMMIT is not on origin/$default"; exit 1; }
          git -C platform checkout --detach "$COMMIT"

      - name: Set up Python for product acceptance cases
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Re-run the changed features' acceptance (raw output; digests anchored in this log)
        shell: bash
        env:
          BASE: ${{ needs.l3.outputs.base }}
        run: |
          set -euo pipefail
          git -C consumer fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          mkdir -p "$RUNNER_TEMP/acceptance-closure"
          node platform/runtime/acceptance/ci-closure.mjs --project consumer --base "origin/$BASE" --out "$RUNNER_TEMP/acceptance-closure"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-closure
          path: ${{ runner.temp }}/acceptance-closure/
          if-no-files-found: error

  acceptance-analyze:
    name: acceptance-analyze
    needs: [l3, acceptance-closure]
    if: always() && github.event_name == 'pull_request' && needs.l3.outputs.platform_commit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      status: ${{ steps.verdict.outputs.status }}
    steps:
      - name: Checkout platform (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform-repo }}
          path: platform
          fetch-depth: 0
          persist-credentials: false

      - name: Select the trusted platform commit
        shell: bash
        env:
          COMMIT: ${{ needs.l3.outputs.platform_commit }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid platform commit"; exit 1; }
          default="$(git -C platform symbolic-ref --short HEAD)"
          git -C platform merge-base --is-ancestor "$COMMIT" "origin/$default" || { echo "::error::platform commit $COMMIT is not on origin/$default"; exit 1; }
          git -C platform checkout --detach "$COMMIT"

      - name: Fetch the consumer PR as Git objects only (never checked out, built or executed)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ needs.l3.outputs.base }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid head sha"; exit 1; }
          git init -q objects
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C objects -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --no-tags "https://github.com/$REPO" "+$HEAD_SHA:refs/candidate/head" "+refs/heads/$BASE:refs/candidate/base"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: acceptance-closure
          path: closure

      - name: This run and the closure job log, from the API
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p closure
          find closure -type l -delete
          run=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '{path, event, headSha: .head_sha, id, attempt: .run_attempt}')
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "path=$(jq -r .path <<<"$run")" >> "$GITHUB_OUTPUT"
          job_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name | endswith("acceptance-closure"))][0].id // empty')
          if [ -n "$job_id" ]; then gh api --allow-escape-sequences "repos/$REPO/actions/jobs/$job_id/logs" > closure.log || rm -f closure.log; fi
          [ -f closure.log ] && [ "$(wc -c < closure.log)" -le 16777216 ] || { echo "no bounded closure job log"; rm -f closure.log; }

      - name: Analyze (trusted platform code, candidate as data)
        id: verdict
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_JSON: ${{ steps.run.outputs.run }}
          CALLER: ${{ steps.run.outputs.path }}
        run: |
          set -euo pipefail
          base=$(git -C objects merge-base refs/candidate/base "$HEAD_SHA")
          log_arg=(); [ -f closure.log ] && log_arg=(--closure-log closure.log)
          node platform/runtime/acceptance/verdict.mjs --repo objects --base "$base" --head "$HEAD_SHA" --closure closure --run "$RUN_JSON" --closure-workflow "$CALLER" "${log_arg[@]}" --out verdict.json || rc=$?; echo "analyzer exit ${rc:-0}: a non-PASS verdict is carried in verdict.json and fails acceptance-governance"
          jq -e '.schemaVersion == 1 and .headSha == env.HEAD_SHA' verdict.json >/dev/null || echo '{"schemaVersion":1,"headSha":null,"status":"BLOCKED","reasons":["analyzer produced no verdict"],"findings":[]}' > verdict.json
          echo "status=$(jq -r .status verdict.json)" >> "$GITHUB_OUTPUT"
          jq -r '"acceptance verdict: \(.status)", (.reasons[]? | "- \(.)")' verdict.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-verdict
          path: verdict.json

  acceptance-human:
    name: acceptance-human
    needs: acceptance-analyze
    if: needs.acceptance-analyze.outputs.status == 'NEEDS_HUMAN' && inputs.acceptance-environment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    environment: ${{ inputs.acceptance-environment }}
    steps:
      - name: Human approval of the acceptance governance findings for this head SHA
        run: echo "Approved through the consumer-owned Environment for ${{ github.event.pull_request.head.sha }}"

  acceptance-governance:
    name: acceptance-governance
    needs: [l3, acceptance-analyze, acceptance-human]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout platform (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.platform-repo }}
          path: platform
          fetch-depth: 0
          persist-credentials: false

      - name: Select the trusted platform commit
        shell: bash
        env:
          COMMIT: ${{ needs.l3.outputs.platform_commit }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no trusted platform commit: acceptance governance is BLOCKED"; exit 1; }
          default="$(git -C platform symbolic-ref --short HEAD)"
          git -C platform merge-base --is-ancestor "$COMMIT" "origin/$default" || { echo "::error::platform commit $COMMIT is not on origin/$default"; exit 1; }
          git -C platform checkout --detach "$COMMIT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: acceptance-verdict
          path: acceptance-verdict

      - name: Read this run's Environment approval records (read-only)
        if: needs.acceptance-human.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN_ID/approvals" > approvals.json || echo "[]" > approvals.json

      - name: Decide (PASS, or NEEDS_HUMAN approved by a pinned consumer reviewer; otherwise this check fails)
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HUMAN: ${{ needs.acceptance-human.result }}
          ENVIRONMENT: ${{ inputs.acceptance-environment }}
          REVIEWERS: ${{ inputs.acceptance-reviewers }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          [ -f approvals.json ] || echo "[]" > approvals.json
          node platform/runtime/consumer/acceptance-gate.mjs --verdict acceptance-verdict/verdict.json --head "$HEAD_SHA" --human "$HUMAN" --environment "$ENVIRONMENT" --reviewers "$REVIEWERS" --author "$AUTHOR" --approvals approvals.json
