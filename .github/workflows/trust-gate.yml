name: trust-gate

# M4.3 (P44 TRUSTED_CALLER_INTEGRITY). `pull_request_target` always runs THIS
# file as it exists on the BASE branch, so a PR cannot replace the caller. The
# PR head is fetched only as git data and is never checked out, built or
# executed. The verdict is published as the check run `ai-native/trust-gate`
# by the `ai-native-trust` GitHub App (not by GITHUB_TOKEN); the main ruleset
# requires that check with source = that App, so a job of the same name in a
# PR (source: github-actions) can never satisfy it.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: trust-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trust-gate:
    name: trust-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BASE (trusted code and config)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR head as data only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${AUTH}" fetch --no-tags origin "refs/pull/${PR}/head"

      - name: Mint ai-native-trust installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TRUST_APP_ID }}
          private-key: ${{ secrets.TRUST_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: read
          permission-contents: read

      - name: Evaluate and emit check run as ai-native-trust
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node runtime/gates/trust-gate.mjs
